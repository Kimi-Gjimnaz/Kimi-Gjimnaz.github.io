<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eksperimenti i Radhërfordit - Simulim Interaktiv</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #090d16;
            color: #f1f5f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        header h1 {
            color: #38bdf8;
            font-size: 26px;
            margin-bottom: 6px;
        }
        header p {
            color: #94a3b8;
            font-size: 14px;
        }
        .main-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 1050px;
        }
        .control-panel {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
            justify-content: flex-start;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1 1 auto;
        }
        .control-group label {
            font-size: 13px;
            color: #cbd5e1;
            font-weight: 600;
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        button {
            background: #0284c7;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
        }
        button:hover {
            background: #0369a1;
        }
        button.active {
            background: #10b981;
        }
        button.danger {
            background: #ef4444;
        }
        button.danger:hover {
            background: #dc2626;
        }
        select, input[type="range"] {
            accent-color: #38bdf8;
            cursor: pointer;
        }
        .sim-area {
            position: relative;
            width: 100%;
            background: #020617;
            border: 2px solid #1e293b;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
            width: 100%;
            max-width: 900px;
            height: auto;
            background: #020617;
        }
        .stats-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            width: 100%;
        }
        .stat-card {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-card .val {
            font-size: 22px;
            font-weight: bold;
            color: #38bdf8;
            margin-top: 4px;
        }
        .stat-card.back .val {
            color: #f43f5e;
        }
        .stat-card.deflect .val {
            color: #f59e0b;
        }
        .info-card {
            background: #1e293b;
            border-left: 4px solid #38bdf8;
            padding: 16px 20px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.6;
            color: #cbd5e1;
        }
        .info-card strong {
            color: #f8fafc;
        }
        @media (max-width: 600px) {
            body {
                padding: 12px;
            }
            header {
                margin-bottom: 16px;
            }
            header h1 {
                font-size: 22px;
            }
            .control-panel {
                gap: 16px;
                padding: 14px;
            }
            .control-group {
                flex-basis: 100%;
                min-width: 0;
            }
            .btn-group button {
                flex: 1 1 auto;
            }
            input[type="range"] {
                width: 100%;
            }
            .stats-panel {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
